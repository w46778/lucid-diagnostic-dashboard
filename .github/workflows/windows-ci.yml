name: Windows CI

on:
  pull_request:
  push:
    branches:
      - agent/diagnostic-foundation

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Production build
        run: npm run build
