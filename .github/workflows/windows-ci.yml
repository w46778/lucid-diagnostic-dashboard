name: Windows CI

on:
  pull_request:
  push:
    branches:
      - agent/diagnostic-foundation

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Diagnostic parser tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Windows production runtime smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PORT = '5099'
          $env:HOST = '127.0.0.1'
          $process = Start-Process -FilePath 'node' -ArgumentList 'dist/index.cjs','--production' -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:5099/api/diagnostics' -TimeoutSec 2
                if ($response.mode -eq 'research') {
                  $ready = $true
                  break
                }
              } catch {
                # Server may still be starting; retry until the deadline.
              }
            }
            if (-not $ready) {
              throw 'Production server did not answer /api/diagnostics on Windows.'
            }
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
